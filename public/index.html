<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SparkIDEA</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <p class="eyebrow">SparkIDEA · your project idea playground</p>
    <h1>Start with something you’re curious about.</h1>
    <p class="intro">Turn one interest into a creative project idea you can make your own.</p>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">What do you want to explore?</h2>
      <form id="idea-form">
        <label for="idea">Your starting idea or interest</label>
        <textarea id="idea" maxlength="500" placeholder="Example: I like plants, but I don’t know what to build." required></textarea>
        <button id="generate" type="submit">Generate Idea <span aria-hidden="true">→</span></button>
      </form>
      <p class="safety">AI may make mistakes. DO NOT TRUST DANGEROUS ACTIVITIES.</p>
    </section>
    <section id="result-card" class="card result-card" hidden aria-live="polite">
      <p class="eyebrow">Your spark</p>
      <div id="result"></div>
      <button id="save" class="secondary" type="button">Save this idea</button>
      <p id="saved" class="saved" hidden>Saved on this computer.</p>
    </section>
    <section class="examples" aria-labelledby="examples-title">
      <h2 id="examples-title">Try an example</h2>
      <div id="examples-list"></div>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
